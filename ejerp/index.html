<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#44113C;--p2:#68245D;--pale:#F5ECF4;--ink:#28222A;--muted:#756B75;--line:#E8DFE7;--good:#24734F;--goodbg:#E9F6EE;--bad:#A53B48;--badbg:#FCEDEF}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:Poppins,Arial,sans-serif}.wrap{width:100%;max-width:1050px;margin:auto;padding:clamp(10px,1.8vw,22px)}.top{display:flex;justify-content:flex-end;margin-bottom:12px}.instruction{display:flex;align-items:center;gap:8px;color:var(--p);font-size:clamp(10px,.95vw,12px);font-weight:500;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px}.info{display:grid;place-items:center;width:20px;height:20px;background:var(--p);color:#fff;border-radius:50%;font-weight:700;font-size:11px;flex:none}.progressline{display:flex;align-items:center;gap:12px;margin-bottom:14px}.progress{height:6px;background:#eee7ed;border-radius:99px;overflow:hidden;flex:1}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--p),#9B5790);border-radius:99px;transition:width .35s}.progresslabel{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}.card,.result{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px #44113c10;animation:enter .5s ease both}.cardtop{display:flex;align-items:center;gap:12px;padding:clamp(15px,2vw,22px);background:linear-gradient(115deg,var(--p),#602452);color:white}.qnumber{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#ffffff20;border:1px solid #ffffff45;font-size:14px;font-weight:700;flex:none}.qmeta{min-width:0;flex:1}.kind{font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.82;font-weight:600}.qtitle{font-size:clamp(15px,1.55vw,20px);font-weight:600;line-height:1.5;margin-top:3px}.qbody{padding:clamp(15px,2vw,23px)}.options{display:grid;gap:9px}.option{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:400 clamp(12px,1.05vw,14px)/1.65 Poppins,sans-serif;cursor:pointer;transition:border .2s,background .2s,transform .2s}.option:hover:not(:disabled){border-color:#c9a9c3;background:#fcf8fb;transform:translateY(-1px)}.letter{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--pale);color:var(--p);font-size:11px;font-weight:700;flex:none}.option[aria-pressed=true]{border-color:var(--p);background:var(--pale)}.option.correct{border-color:#9bcdb0;background:var(--goodbg)}.option.correct .letter{background:var(--good);color:white}.option.wrong{border-color:#e2a8ae;background:var(--badbg)}.option.wrong .letter{background:var(--bad);color:white}.option:disabled{cursor:default}.feedback{display:none;margin-top:15px;border-radius:12px;padding:14px 15px;font-size:12px;line-height:1.7;animation:enter .25s ease both}.feedback.show{display:block}.feedback.good{background:var(--goodbg);border:1px solid #c8e7d2}.feedback.bad{background:var(--badbg);border:1px solid #f0cbd0}.feedtitle{font-weight:700;margin-bottom:4px}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}.status{font-size:11px;color:var(--muted)}.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--p);color:white;font:600 12px Poppins,sans-serif;cursor:pointer;transition:background .2s,transform .2s}.btn:hover{background:var(--p2);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}.btn.secondary{background:var(--pale);color:var(--p)}.btn.secondary:hover{background:#ead8e8}.result{display:none;text-align:center;padding:28px 20px}.result.show{display:block}.trophy{font-size:38px;color:var(--p)}.score{font-size:clamp(30px,5vw,48px);font-weight:800;color:var(--p);line-height:1.2}.result h2{font-size:20px;color:var(--p);margin:10px 0}.result p{font-size:13px;color:var(--muted);line-height:1.7}.resultactions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:18px}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.wrap{padding:8px}.instruction{white-space:normal;border-radius:12px}.cardtop{align-items:flex-start}.qnumber{width:36px;height:36px}.option{padding:11px}.actions{align-items:stretch}.actions .btn{flex:1}.status{width:100%;order:3}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><div class="top"><div class="instruction"><span class="info">i</span><span>Seleccione una respuesta y revise la realimentación antes de continuar.</span></div></div><div class="progressline" id="progressline"><div class="progress"><div class="bar" id="bar"></div></div><div class="progresslabel" id="progresslabel">Pregunta 1 de 4</div></div><section class="card" id="quiz" aria-live="polite"><div class="cardtop"><div class="qnumber" id="qnumber">01</div><div class="qmeta"><div class="kind" id="kind"></div><div class="qtitle" id="question"></div></div></div><div class="qbody"><div class="options" id="options"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><span class="status" id="status">Seleccione una opción para comprobar su respuesta.</span><button class="btn" id="next" disabled>Continuar →</button></div></div></section><section class="result" id="result"><div class="trophy">✦</div><div class="score" id="score">0/4</div><h2 id="resulttitle">¡Repaso completado!</h2><p id="resulttext"></p><div class="resultactions"><button class="btn" id="review">Revisar respuestas</button><button class="btn secondary" id="restart">↻ Intentar de nuevo</button></div></section></main>
<script>
const Q=[
{type:'Selección múltiple',prompt:'¿Cuál es la función principal del Balance Energético Colombiano (BECO)?',options:['Regular los precios de la energía en el mercado nacional.','Planificar y registrar los flujos energéticos, desde la producción hasta el consumo final de diferentes tipos de energía.','Controlar la distribución de electricidad exclusivamente.','Predeterminar el consumo energético en todos los sectores.'],correct:1,feedback:'El BECO es una herramienta clave de planificación energética nacional elaborada por la UPME. Permite registrar y analizar los flujos energéticos del país en distintos sectores y para varias fuentes energéticas (MEQ, 2024).'},
{type:'Verdadero o falso',prompt:'El mercado regulado de energía permite que todos los usuarios negocien libremente sus tarifas con los comercializadores.',options:['Verdadero','Falso'],correct:1,feedback:'Solo los grandes consumidores (usuarios no regulados) pueden negociar libremente. Los usuarios residenciales y pequeños comercios del mercado regulado están sujetos a tarifas definidas por la CREG (Resolución 101, 2023).'},
{type:'Selección múltiple',prompt:'¿Cuál es la característica principal del mercado de contratos bilaterales en el Mercado de Energía Mayorista (MEM) colombiano?',options:['Negociación diaria de energía con precios fijos.','Acuerdos de compraventa de energía a mediano y largo plazo para mitigar riesgos de volatilidad.','Operación exclusiva para energías renovables no convencionales.','Es un mecanismo diseñado para la liquidación y facturación de cargos.'],correct:1,feedback:'El mercado de contratos bilaterales representa aproximadamente el 80 % de las transacciones y se basa en contratos de 1 a 5 años, con el objetivo de reducir riesgos asociados a la volatilidad de precios en el corto plazo (Resolución 101, 2023).'},
{type:'Verdadero o falso',prompt:'Los usuarios no regulados en Colombia pueden negociar libremente sus precios y elegir su comercializador, ya que su demanda es igual o superior a 0.1 MW o su consumo igual o superior a 55 MWh/mes.',options:['Verdadero','Falso'],correct:0,feedback:'Los usuarios no regulados, con los niveles de demanda o consumo indicados, pueden negociar precios libremente y elegir su comercializador, según lo establecido en la regulación colombiana (Ley 142, 1994; Ley 143, 1994).'}];
let idx=0,answers=Array(4).fill(null),reviewMode=false;
const $=id=>document.getElementById(id);
function render(){const q=Q[idx];$('qnumber').textContent=String(idx+1).padStart(2,'0');$('kind').textContent=q.type;$('question').textContent=q.prompt;$('progresslabel').textContent=`Pregunta ${idx+1} de 4`;$('bar').style.width=`${idx/4*100}%`;$('options').innerHTML='';q.options.forEach((txt,i)=>{let b=document.createElement('button');b.className='option';b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML='<span class="letter"></span><span class="opttext"></span>';b.querySelector('.letter').textContent=q.options.length===2?(i===0?'V':'F'):String.fromCharCode(65+i);b.querySelector('.opttext').textContent=txt;b.onclick=()=>choose(i);$('options').appendChild(b)});$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('next').textContent=idx===3?'Ver resultado →':'Continuar →';$('status').textContent='Seleccione una opción para comprobar su respuesta.';if(answers[idx]!==null)showAnswer()}
function choose(i){if(answers[idx]!==null)return;answers[idx]=i;showAnswer()}
function showAnswer(){let q=Q[idx],a=answers[idx];[...$('options').children].forEach((b,i)=>{b.disabled=true;b.setAttribute('aria-pressed',String(i===a));if(i===q.correct)b.classList.add('correct');else if(i===a)b.classList.add('wrong')});let good=a===q.correct;$('feedback').className='feedback show '+(good?'good':'bad');$('feedback').innerHTML='<div class="feedtitle">'+(good?'¡Correcto!':'Respuesta incorrecta')+'</div><div></div>';$('feedback').lastElementChild.textContent=q.feedback;$('status').textContent=good?'Respuesta acertada.':'Respuesta correcta: '+q.options[q.correct];$('next').disabled=false;$('bar').style.width=((idx+1)/4*100)+'%'}
$('next').onclick=()=>{if(answers[idx]===null)return;if(idx<3){idx++;render()}else finish()};
function finish(){ $('quiz').style.display='none';$('progressline').style.display='none';let score=answers.filter((a,i)=>a===Q[i].correct).length;$('score').textContent=score+'/4';$('resulttitle').textContent=score===4?'¡Excelente dominio!':score>=3?'¡Muy buen trabajo!':'¡Repasemos un poco más!';$('resulttext').textContent=`Obtuviste ${score} de 4 respuestas correctas (${Math.round(score/4*100)} %). Puedes revisar tus respuestas o volver a intentarlo.`;$('result').classList.add('show')}
$('restart').onclick=()=>{idx=0;answers=Array(4).fill(null);$('quiz').style.display='';$('progressline').style.display='';$('result').classList.remove('show');render()};
$('review').onclick=()=>{idx=0;$('quiz').style.display='';$('progressline').style.display='';$('result').classList.remove('show');render()};
render();
</script></body></html>
