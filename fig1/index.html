<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estructura institucional del sector eléctrico colombiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#101e30;--navy2:#385675;--cyan:#00d9f2;--green:#83c342;--paper:#f5f6f8;--ink:#20232a}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:'Poppins',Arial,sans-serif;color:var(--ink)}
.wrap{max-width:1500px;margin:auto;padding:10px}
.scene{position:relative;width:100%;aspect-ratio:1504/1017;overflow:hidden;background:var(--paper);isolation:isolate}
svg{display:block;width:100%;height:100%}
.left-bg{fill:url(#bg)}
.panel{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .65s cubic-bezier(.2,.75,.25,1) forwards;animation-delay:var(--d,0s)}
.icon-ring{fill:none;stroke:var(--cyan);stroke-width:2}
.icon{fill:none;stroke:var(--cyan);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.side-label{font:500 27px Poppins,Arial,sans-serif;fill:#e7eaf0}
.heading{font:400 38px Poppins,Arial,sans-serif;fill:#202d43}
.heading-muted{fill:#7e94b2}
.org-title{font:400 23px Poppins,Arial,sans-serif;fill:#222}
.org-label{font:400 21px Poppins,Arial,sans-serif;fill:#222}
.law-text{font:500 26px Poppins,Arial,sans-serif;fill:#fff}
.arrow-line{stroke:var(--green);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:220;stroke-dashoffset:220;animation:draw .75s ease forwards;animation-delay:var(--d,0s)}
.arrow-head{fill:var(--green);opacity:0;animation:fade .25s ease forwards;animation-delay:var(--d,0s)}
.label-arrow{font:400 21px Poppins,Arial,sans-serif;fill:#415d7d}
.item{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .65s cubic-bezier(.2,.75,.25,1) forwards;animation-delay:var(--d,0s)}
.logo-text{font-family:Arial,Helvetica,sans-serif;font-weight:700}
.actions{display:flex;justify-content:center;margin-top:12px}
button{display:inline-flex;align-items:center;gap:9px;background:#44113c;color:#fff;border:0;border-radius:999px;padding:12px 19px;font:600 13px Poppins,Arial,sans-serif;cursor:pointer;box-shadow:0 5px 18px #44113c26;transition:transform .2s,background .2s}
button:hover{background:#68245d;transform:translateY(-2px)}
button:focus-visible{outline:3px solid #bda0b9;outline-offset:3px}
button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@media(max-width:650px){.wrap{padding:3px}.actions{margin-top:7px}button{font-size:11px;padding:10px 15px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
