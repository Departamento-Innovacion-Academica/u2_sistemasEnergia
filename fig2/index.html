<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esquema institucional del sector energético</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#292929;--line:#444;--plum:#44113C}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.wrap{max-width:1500px;margin:auto;padding:12px}
.stage{position:relative;width:100%;aspect-ratio:1445/1024;height:auto;min-height:0;overflow:visible;background:#fff}
svg.diagram{display:block;position:relative;inset:auto;width:100%;height:auto;aspect-ratio:1445/1024;overflow:visible}
.wires{fill:none;stroke:#444;stroke-width:2.7;stroke-linecap:square;stroke-linejoin:round}
.wire{stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 1.1s ease forwards;animation-delay:var(--d,0s)}
.wire.green{stroke:#38863C;stroke-width:4}
.node{opacity:0;transform-box:fill-box;transform-origin:center;animation:nodeIn .45s ease forwards;animation-delay:var(--d,0s)}
.node rect,.node ellipse{transition:filter .2s,stroke-width .2s}
.node:hover rect,.node:hover ellipse{filter:drop-shadow(0 5px 7px rgba(0,0,0,.18));stroke:#44113C;stroke-width:2}
.text{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#222;text-anchor:middle}
.label{font-size:21px}
.small{font-size:20px}
.title{font-size:23px}
.creg{font-size:36px;fill:white}
.actions{display:flex;justify-content:center;gap:12px;margin:12px auto 0}
button{font:600 13px Arial,Helvetica,sans-serif;border:0;border-radius:999px;padding:12px 18px;background:#44113C;color:#fff;cursor:pointer;box-shadow:0 5px 15px rgba(68,17,60,.17);transition:transform .2s,background .2s}
button:hover{transform:translateY(-2px);background:#68245D}
button:focus-visible{outline:3px solid #C7A4C1;outline-offset:3px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes nodeIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media(max-width:650px){.wrap{padding:4px}.stage{min-height:0;width:100%;aspect-ratio:1445/1024}.actions{margin-top:8px}button{padding:10px 14px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
<div class="stage" id="stage" role="img" aria-label="Diagrama de la estructura institucional del sector energético colombiano">
<svg class="diagram" id="diagram" viewBox="0 0 1445 1024" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svgtitle">
<title id="svgtitle">Política sectorial, regulación, operación, mercado y agentes del sector energético</title>
<!-- Conectores del esquema, dibujados primero para mantenerlos detrás de los nodos -->
<g class="wires">
 <!-- Marco institucional y conexión con inversionistas -->
 <path class="wire" style="--d:.05s" d="M141 153 H54 V832 H74"/>
 <!-- Política sectorial hacia planeación y regulación -->
 <path class="wire" style="--d:.1s" d="M290 248 V410"/>
 <path class="wire" style="--d:.15s" d="M452 214 V302 H357 V410"/>
 <path class="wire green" style="--d:.2s" d="M547 248 V383"/>
 <!-- Política sectorial hacia control y vigilancia -->
 <path class="wire" style="--d:.25s" d="M980 153 H1195 V187"/>
 <!-- Regulación hacia operación: conexión continua entre ambos bordes -->
 <path class="wire" style="--d:.3s" d="M696 464 H1060"/>
 <!-- Operación y mercado: conexión desde el borde de Operación hasta el borde de Mercado -->
 <path class="wire" style="--d:.35s" d="M1385 490 H1412 V720 H1385"/>
 <!-- Regulación hacia agentes -->
 <path class="wire" style="--d:.4s" d="M547 545 V653"/>
 <!-- Inversionistas hacia el bus de agentes -->
 <path class="wire" style="--d:.45s" d="M291 834 H385"/>
 <path class="wire" style="--d:.46s" d="M385 712 V915"/>
 <path class="wire" style="--d:.5s" d="M385 712 H439"/>
 <path class="wire" style="--d:.55s" d="M385 779 H439"/>
 <path class="wire" style="--d:.6s" d="M385 847 H439"/>
 <path class="wire" style="--d:.62s" d="M385 915 H439"/>
 <!-- Agentes hacia Mercado -->
 <path class="wire" style="--d:.65s" d="M790 720 H1060"/>
 <!-- Agentes hacia Usuarios: bus y ramales conectados -->
 <path class="wire" style="--d:.7s" d="M790 869 H925"/>
 <path class="wire" style="--d:.72s" d="M925 869 V936"/>
 <path class="wire" style="--d:.75s" d="M925 910 H1060"/>
 <path class="wire" style="--d:.77s" d="M790 936 H925"/>
</g>
<!-- Política sectorial y administración de empresas estatales -->
<g class="node" style="--d:.75s">
 <rect x="141" y="45" width="839" height="203" rx="4" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="2.5"/>
 <text class="text title" x="560" y="86">Política sectorial y admon. Empresas estatales</text>
 <rect x="196" y="126" width="189" height="82" rx="4" fill="#FFCF80"/>
 <text class="text label" x="290" y="159"><tspan x="290">Ministerio de</tspan><tspan x="290" dy="27">Hacienda</tspan></text>
 <rect x="452" y="119" width="190" height="95" rx="4" fill="#43A047"/>
 <text class="text label" x="547" y="160" fill="#fff" style="fill:white"><tspan x="547">Ministerio de</tspan><tspan x="547" dy="27">Minas y Energía</tspan></text>
 <rect x="709" y="126" width="189" height="82" rx="3" fill="#E0E0E0"/>
 <text class="text label" x="804" y="174">DNP</text>
</g>
<!-- Planeación -->
<g class="node" style="--d:.95s">
 <rect x="189" y="410" width="216" height="122" rx="5" fill="#90CAF9"/>
 <text class="text label" x="297" y="458"><tspan x="297">Planeación</tspan><tspan x="297" dy="34">UPME</tspan></text>
</g>
<!-- Regulación CREG -->
<g class="node" style="--d:1.05s">
 <text class="text label" x="682" y="356">Regulación</text>
 <ellipse cx="547" cy="464" rx="149" ry="81" fill="#E93632"/>
 <text class="text creg" x="547" y="475">CREG</text>
</g>
<!-- Control y vigilancia -->
<g class="node" style="--d:1.15s">
 <ellipse cx="1195" cy="275" rx="148" ry="88" fill="#AFEAF2"/>
 <text class="text label" x="1195" y="255"><tspan x="1195">Control y Vigilancia</tspan><tspan x="1195" dy="39">SSP</tspan></text>
</g>
<!-- Operación -->
<g class="node" style="--d:1.25s">
 <rect x="1060" y="410" width="325" height="135" rx="5" fill="#EEEEEE"/>
 <text class="text label" x="1222" y="443">Operación</text>
 <rect x="1087" y="464" width="108" height="54" rx="3" fill="#fff"/>
 <text class="text label" x="1141" y="499">CNO</text>
 <rect x="1249" y="464" width="108" height="54" rx="3" fill="#fff"/>
 <text class="text label" x="1303" y="499">CND</text>
</g>
<!-- Inversionistas -->
<g class="node" style="--d:1.35s">
 <rect x="74" y="793" width="217" height="82" rx="4" fill="#FFF59D"/>
 <text class="text label" x="182" y="841">Inversionistas</text>
</g>
<!-- Agentes -->
<g class="node" style="--d:1.45s">
 <rect x="439" y="653" width="351" height="352" rx="5" fill="#B3DCFA"/>
 <rect x="493" y="686" width="243" height="53" rx="2" fill="#fff"/>
 <text class="text label" x="614" y="720">Generación</text>
 <rect x="493" y="753" width="243" height="53" rx="2" fill="#fff"/>
 <text class="text label" x="614" y="787">Transmisión</text>
 <rect x="493" y="820" width="243" height="53" rx="2" fill="#fff"/>
 <text class="text label" x="614" y="854">Distribución</text>
 <rect x="493" y="888" width="243" height="53" rx="2" fill="#fff"/>
 <text class="text label" x="614" y="922">Comercialización</text>
 <text class="text label" x="614" y="979">Agentes</text>
</g>
<!-- Mercado -->
<g class="node" style="--d:1.55s">
 <rect x="1060" y="639" width="325" height="136" rx="5" fill="#FFB74D"/>
 <rect x="1087" y="666" width="108" height="55" rx="3" fill="#fff"/>
 <text class="text label" x="1141" y="701">ASIC</text>
 <rect x="1249" y="666" width="108" height="55" rx="3" fill="#fff"/>
 <text class="text label" x="1303" y="701">XM</text>
 <text class="text label" x="1222" y="755">Mercado</text>
</g>
<!-- Usuarios -->
<g class="node" style="--d:1.65s">
 <rect x="1060" y="856" width="325" height="108" rx="5" fill="#EF999B"/>
 <text class="text label" x="1222" y="903"><tspan x="1222">Usuarios Regulados</tspan><tspan x="1222" dy="28">y no Regulados</tspan></text>
</g>
</svg>
</div>
<div class="actions">
<button id="replay" type="button">↻ Volver a ver la animación</button>
</div>
</main>
<script>
(function(){
 const svg=document.getElementById('diagram');
 const replay=document.getElementById('replay');
 function play(){
   const animated=svg.querySelectorAll('.wire, .node');
   animated.forEach(el=>{
     el.style.animation='none';
     el.style.opacity='';
   });
   // Forzar recálculo de estilos antes de reiniciar las animaciones.
   void svg.getBoundingClientRect();
   requestAnimationFrame(()=>{
     animated.forEach(el=>{
       el.style.animation='';
     });
   });
 }
 replay.addEventListener('click',play);
})();
</script>
</body>
</html>
