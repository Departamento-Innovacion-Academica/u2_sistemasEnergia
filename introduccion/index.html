<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elementos del módulo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#44113C;--plum2:#68245D;--soft:#F5ECF4;--ink:#211C22;--muted:#756A76;--line:#E8DFE7;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:transparent;font-family:'Poppins',sans-serif;color:var(--ink)}
.explorer{max-width:1250px;margin:auto;padding:clamp(12px,2vw,25px)}
.topline{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:17px}
.instruction{font-size:11px;line-height:1.5;color:var(--muted);display:flex;align-items:center;gap:8px;text-align:right}
.instruction svg{width:17px;height:17px;flex:0 0 auto;stroke:var(--plum);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.counter{font-size:10px;font-weight:600;color:var(--plum);background:var(--soft);border-radius:999px;padding:7px 11px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;perspective:1200px}
.card{position:relative;min-width:0;min-height:220px;border:0;border-radius:18px;background:transparent;padding:0;cursor:pointer;text-align:left;color:inherit;font-family:inherit;perspective:1000px;opacity:0;transform:translateY(15px);animation:enter .6s cubic-bezier(.2,.75,.25,1) forwards;animation-delay:var(--delay)}
.card-inner{position:relative;width:100%;height:100%;min-height:220px;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.75,.25,1);border-radius:18px}
.card[aria-pressed="true"] .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 23px rgba(54,25,51,.06)}
.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(145deg,#fff 0%,#fff 62%,#F8F2F7 100%);transition:border-color .25s,box-shadow .25s}
.front:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--plum)}
.front:after{content:"";position:absolute;width:140px;height:140px;right:-65px;top:-78px;border-radius:50%;background:var(--soft);transition:transform .35s}
.card:hover .front:after,.card:focus-visible .front:after{transform:scale(1.4)}
.card:hover .face,.card:focus-visible .face{box-shadow:0 16px 38px rgba(68,17,60,.13);border-color:#CDB8CB}
.card:focus-visible{outline:3px solid #B993B3;outline-offset:4px;border-radius:20px}
.iconbox{position:relative;z-index:1;width:52px;height:52px;border-radius:16px;background:var(--soft);color:var(--plum);display:grid;place-items:center;margin-bottom:17px;box-shadow:0 5px 13px rgba(68,17,60,.06)}
.iconbox svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.front h2{position:relative;z-index:1;font-size:clamp(18px,2vw,24px);line-height:1.35;letter-spacing:-.03em;color:var(--plum);font-weight:600;margin:0;max-width:360px}
.card-num{position:absolute;z-index:1;top:16px;right:17px;font-size:10px;letter-spacing:.08em;color:#9B8999;font-weight:600}
.flip-hint{position:absolute;z-index:1;bottom:16px;display:flex;align-items:center;gap:6px;color:#8B7B89;font-size:10px;font-weight:500}
.flip-hint svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{transform:rotateY(180deg);display:flex;flex-direction:column;padding:clamp(19px,2.3vw,27px);background:var(--white)}
.back:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--plum)}
.back-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.back-tag{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--plum);font-weight:600;background:var(--soft);padding:6px 8px;border-radius:7px}
.back h2{font-size:clamp(16px,1.6vw,20px);line-height:1.35;letter-spacing:-.02em;color:var(--plum);margin:0 0 9px;font-weight:600}
.back p{font-size:clamp(11.5px,1.12vw,13px);line-height:1.75;color:#554B57;margin:0}
.back-bottom{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:auto;padding-top:13px;font-size:10px;font-weight:600;color:var(--plum)}
.back-bottom svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes enter{to{opacity:1;transform:translateY(0)}}
@media(max-width:650px){.explorer{padding:10px}.cards{grid-template-columns:1fr;gap:12px}.card,.card-inner{min-height:215px}.front h2{font-size:21px}.back{padding:20px 20px 18px 23px}.back p{font-size:12.5px;line-height:1.75}.instruction{font-size:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="explorer">
  <div class="topline">
    <div class="instruction"><svg viewBox="0 0 24 24"><path d="M8 11V5a2 2 0 0 1 4 0v5-2a2 2 0 0 1 4 0v3-1a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-5-2l-3-3a2 2 0 0 1 3-3l2 2"/></svg>Haga clic sobre cada tarjeta para ampliar la información.</div>
  </div>
  <section class="cards" aria-label="Tarjetas interactivas de los elementos del módulo">
    <button class="card" type="button" aria-pressed="false" style="--delay:70ms">
      <div class="card-inner">
        <div class="face front"><span class="card-num">01 / 04</span><span class="iconbox"><svg viewBox="0 0 24 24"><path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z"/><path d="m3.5 12 8.5 4.5 8.5-4.5M3.5 16.5 12 21l8.5-4.5"/></svg></span><h2>Conocimientos previos</h2><span class="flip-hint"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7.5 7.5 0 1 1-2-5.1L20 12"/></svg>Girar tarjeta</span></div>
        <div class="face back"><div class="back-top"><span class="back-tag">Punto de partida</span><span class="card-num">01</span></div><h2>Conocimientos previos</h2><p>Formación básica en las áreas de ingeniería, preferiblemente con fundamentación en el uso de herramientas computacionales aplicadas a la ingeniería, así como en modelamiento y simulación.</p><div class="back-bottom">Volver <svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></div></div>
      </div>
    </button>
    <button class="card" type="button" aria-pressed="false" style="--delay:160ms">
      <div class="card-inner">
        <div class="face front"><span class="card-num">02 / 04</span><span class="iconbox"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 20v-1.5a7 7 0 0 1 14 0V20"/><path d="M4 5.5 6 4m14 1.5L18 4M12 1v1"/></svg></span><h2>Competencias</h2><span class="flip-hint"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7.5 7.5 0 1 1-2-5.1L20 12"/></svg>Girar tarjeta</span></div>
        <div class="face back"><div class="back-top"><span class="back-tag">Desarrollo de capacidades</span><span class="card-num">02</span></div><h2>Competencias</h2><p>El módulo contribuye al desarrollo de competencias relacionadas con el análisis y modelamiento de los sistemas energéticos, así como con la interpretación y aplicación de la reglamentación vigente aplicable a cada caso específico.</p><div class="back-bottom">Volver <svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></div></div>
      </div>
    </button>
    <button class="card" type="button" aria-pressed="false" style="--delay:250ms">
      <div class="card-inner">
        <div class="face front"><span class="card-num">03 / 04</span><span class="iconbox"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-5M12 3v2"/></svg></span><h2>Objetivos</h2><span class="flip-hint"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7.5 7.5 0 1 1-2-5.1L20 12"/></svg>Girar tarjeta</span></div>
        <div class="face back"><div class="back-top"><span class="back-tag">Propósito del módulo</span><span class="card-num">03</span></div><h2>Objetivos</h2><p>Conocer, comprender y aplicar los modelos que permiten representar y analizar un sistema de energía.</p><div class="back-bottom">Volver <svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></div></div>
      </div>
    </button>
    <button class="card" type="button" aria-pressed="false" style="--delay:340ms">
      <div class="card-inner">
        <div class="face front"><span class="card-num">04 / 04</span><span class="iconbox"><svg viewBox="0 0 24 24"><path d="M4 19.5V5.8A1.8 1.8 0 0 1 5.8 4H20v16H5.8A1.8 1.8 0 0 1 4 18.2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span><h2>Resultados de aprendizaje</h2><span class="flip-hint"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5"/><path d="M19 12a7.5 7.5 0 1 1-2-5.1L20 12"/></svg>Girar tarjeta</span></div>
        <div class="face back"><div class="back-top"><span class="back-tag">Logro esperado</span><span class="card-num">04</span></div><h2>Resultados de aprendizaje</h2><p>Identifica las etapas que componen la cadena de la energía y reconoce sus características operacionales, de acuerdo con la planificación y la regulación vigente.</p><div class="back-bottom">Volver <svg viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></div></div>
      </div>
    </button>
  </section>
</main>
<script>
(function(){
 const cards=[...document.querySelectorAll('.card')];
 cards.forEach(card=>{
   card.addEventListener('click',()=>{
     const flip=card.getAttribute('aria-pressed')!=='true';
     card.setAttribute('aria-pressed',String(flip));
     card.setAttribute('aria-label',flip?'Mostrar título solamente: '+card.querySelector('.back h2').textContent:'Ampliar información: '+card.querySelector('.front h2').textContent);
   });
   card.addEventListener('keydown',e=>{
     if(e.key==='Escape'&&card.getAttribute('aria-pressed')==='true'){card.setAttribute('aria-pressed','false');}
   });
 });
})();
</script>
</body>
</html>
