<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--p:#44113C;--pale:#F5ECF4;--ink:#211D22}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);font-family:Poppins,Arial,sans-serif}.wrap{width:100%;max-width:1500px;margin:auto;padding:clamp(8px,1.5vw,18px)}.shell{border:1px solid #e8e2e7;border-radius:13px;overflow:hidden;box-shadow:0 8px 24px #30182d0f}table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}th{background:var(--p);color:white;text-align:left;font-size:clamp(12px,1.1vw,16px);font-weight:600;line-height:1.5;padding:16px 16px;border-right:1px solid #ffffff50;opacity:0;transform:translateY(-10px);animation:in .55s ease forwards;animation-delay:var(--d)}th:last-child,td:last-child{border-right:0}thead th{text-align:center}td{vertical-align:middle;padding:17px 16px;border-right:1px solid white;border-top:1px solid white;font-size:clamp(12px,1.15vw,17px);line-height:1.75;overflow-wrap:anywhere;opacity:0;transform:translateY(12px);animation:in .55s ease forwards;animation-delay:var(--d)}tbody tr:nth-child(odd){background:#f4f4f4}tbody tr:nth-child(even){background:#fff}tbody tr:hover{background:var(--pale)}td:first-child,td:nth-child(3){font-weight:600;color:var(--p)}.time{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--p);flex:none}.peak .dot{background:#B54D3C}.mid .dot{background:#C18A2B}.valley .dot{background:#4C8A69}.controls{display:flex;justify-content:center;margin-top:13px}button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--p);color:white;padding:11px 18px;font:600 12px Poppins,sans-serif;cursor:pointer;box-shadow:0 6px 18px #44113c25;transition:transform .2s,background .2s}button:hover{background:#68245d;transform:translateY(-1px)}button:focus-visible{outline:3px solid #bfa0ba;outline-offset:4px}@keyframes in{to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.wrap{padding:8px}.shell{border:0;box-shadow:none;overflow:visible}table,tbody{display:block;width:100%}thead{display:none}tbody{display:grid;gap:12px}tr{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e8e2e7;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px #30182d0c}td{padding:12px;font-size:12px;line-height:1.6}td:before{content:attr(data-label);display:block;color:#766d76;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}td:last-child{grid-column:1/-1;border-top:1px solid #eee}td:first-child{background:var(--pale)}.time{white-space:normal}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><div class="shell"><table aria-label="Periodos horarios y niveles tarifarios"><colgroup><col style="width:18%"><col style="width:38%"><col style="width:20%"><col style="width:24%"></colgroup><thead><tr><th style="--d:.05s">Periodo</th><th style="--d:.11s">Horario típico</th><th style="--d:.17s">Nivel tarifario</th><th style="--d:.23s">Objetivo</th></tr></thead><tbody>
<tr class="peak"><td style="--d:.12s" data-label="Periodo"><span class="time"><span class="dot"></span>Punta</span></td><td style="--d:.12s" data-label="Horario típico">18:00 – 22:00</td><td style="--d:.12s" data-label="Nivel tarifario">Tarifa alta</td><td style="--d:.12s" data-label="Objetivo">Desincentivar consumo</td></tr>
<tr class="mid"><td style="--d:.24s" data-label="Periodo"><span class="time"><span class="dot"></span>Intermedio</span></td><td style="--d:.24s" data-label="Horario típico">06:00 – 18:00 / 22:00 – 00:00</td><td style="--d:.24s" data-label="Nivel tarifario">Tarifa media</td><td style="--d:.24s" data-label="Objetivo">Transición</td></tr>
<tr class="valley"><td style="--d:.36s" data-label="Periodo"><span class="time"><span class="dot"></span>Valle</span></td><td style="--d:.36s" data-label="Horario típico">00:00 – 06:00</td><td style="--d:.36s" data-label="Nivel tarifario">Tarifa reducida</td><td style="--d:.36s" data-label="Objetivo">Incentivar consumo</td></tr>
</tbody></table></div><div class="controls"><button id="replay" type="button">⟳ Volver a ver la animación</button></div></main><script>document.getElementById('replay').addEventListener('click',()=>{const els=[...document.querySelectorAll('th,td')];els.forEach(e=>e.style.animation='none');void document.body.offsetWidth;requestAnimationFrame(()=>els.forEach(e=>e.style.animation=''))});</script></body></html>
